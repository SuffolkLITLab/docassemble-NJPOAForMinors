id: Delegated Powers
question: |
  Delegated Powers
subquestion: Specify the powers being delegated to the Caregiver
fields:
  - label: "Caregiving power "
    field: power_caregiving_yes
    datatype: yesno
    help: "Temporary care-giving authority for the child(ren)/ward(s), until such time as the child(ren)/ward(s) is/are returned to our/my physical custody, or his/her/their custody status is altered by a federal, state, or local agency; or changed by a court of law."
  - label: Well-being power
    field: power_wellbeing_yes
    datatype: yesno
    help: "Power to provide for the physical and mental well-being of the child(ren)/ward(s), including but not limited to providing food and shelter."
  - label: "Education power "
    field: power_education_yes
    datatype: yesno
    help: "The authority to enroll the child(ren)/ward(s) in the appropriate educational institutions; obtain access to his/her/their school records; authorize his/her/their participation in school activities; and make any and all decisions related to his/her/their education, including, but not limited to, those related to special education."
  - label: Healthcare power
    field: power_healthcare_yes
    datatype: yesno
    help: "The authority, to the same extent that a parent/custodian/guardian would have the authority, to make medical, dental, and mental health decisions; to sign documents, waivers and releases required by a hospital or physician; to access medical, dental, or mental health records concerning the child(ren)/ward(s); to authorize his/her/their admission to or discharge from any hospital or medical care facility; to consult with any provider of health care; to consent to the provision, withholding, modification or withdrawal of any health care procedure; and to make other decisions related to the health care needs of the child(ren)/ward(s)."
  - label: "Travel power "
    field: power_travel_yes
    datatype: yesno
    help: "The authority to make travel arrangements on behalf of the child(ren)/ward(s) for destinations both inside and outside of the United States by air and/or ground transportation; to accompany the child(ren)/ward(s) on any such trips; and to make any and all related arrangements on behalf of the child(ren)/ward(s), including but not limited to hotel accommodations."
  - label: "Financial power "
    field: power_financial_yes
    datatype: yesno
    help: The power to handle any and all financial affairs and any and all personal and legal matters concerning the child(ren)/ward(s).
  - label: "All Other Powers "
    field: power_other_yes
    datatype: yesno
    help: "The authority to handle and engage in any and all other matters relating to the care, custody, and property of the child or ward which are permitted pursuant to applicable State law."
