id: Delegated Powers
question: |2
  Which powers do you wish to give to the Caregiver?
fields:
  - label: "Caregiving Power "
    field: power_caregiving_yes
    datatype: yesno
    help: Temporary care-giving power over the child(ren) or ward(s)
  - label: Well-Being Power
    field: power_wellbeing_yes
    datatype: yesno
    help: Power to provide for the physical and mental well-being of the child(ren) or ward(s) (i.e. providing food and shelter)
  - label: "Education Power "
    field: power_education_yes
    datatype: yesno
    help: "Power to enroll the child(ren) or ward(s) in the appropriate schools; to access school records; to authorize participation in school activities; and to make any and all decisions related to education, including special education"
  - label: Healthcare Power
    field: power_healthcare_yes
    datatype: yesno
    help: "The power to make medical, dental, and mental health decisions; to sign documents, waivers and releases required by a hospital or physician; to access medical, dental, or mental health records; to authorize admission to or discharge from any hospital or medical care facility; to consult with any health care provider; to consent to the provision, withholding, modification or withdrawal of any health care procedure; and to make other decisions related to the health care needs of the child(ren) or ward(s)"
  - label: "Travel Power "
    field: power_travel_yes
    datatype: yesno
    help: The power to make travel and all related arrangements for the child(ren) or ward(s) (i.e. hotel accommodations) both nationally and internationally; to join them on any such trips
  - label: "Financial Power "
    field: power_financial_yes
    datatype: yesno
    help: The power to handle financial decisions and personal and legal matters concerning the child(ren) or ward(s)
  - label: "All Other Powers "
    field: power_other_yes
    datatype: yesno
    help: "The power to handle and engage in any and all other matters relating to the care, custody, and property of the child or ward which are permitted pursuant to applicable State law"
