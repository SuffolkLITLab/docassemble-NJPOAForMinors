  % if share_custody and other_parent_will_sign:
  and ${ other_parent[0].name_full() }
  % endif
  and want to sign this document electronically?
fields:
  - no label: sign_now
    datatype: yesnoradio

---
id: code_1791484735545
code: |
  users_signature_date = today()
  witnesses1_signature_date = today()
  witnesses2_signature_date = today()
  
  if share_custody and other_parent_will_sign:
    other_parent_signature_date = today()
  
      

---
id: children names 1
sets:
  - "children[i].name.suffix"
  - "children[i].name.first"
  - "children[i].name.last"
  - "children[i].name.middle"
question: |2
  % if hasattr(children, 'ask_number') and children.ask_number and children.target_number == 1:
  Child or ward
  % else:
  ${ capitalize(ordinal(i)) } child or ward
  % endif
fields:
  - code: |
      children[i].name_fields(show_suffix=False)
  - Birthdate: "children[i].birthdate"
    datatype: BirthDate
---
id: check child age
sets:
  - children[i].age_checked
code: |
  children[i].name.first
  children[i].birthdate
  while children[i].birthdate <= today().minus(years=18):
    adult_child_action
    if adult_child_action == 'exit':
      command('exit')
    elif adult_child_action == 'restart_children':
      undefine('adult_child_action')
      # setattr avoids docassemble thinking this block defines target_number
      setattr(children, 'target_number', i + 1)
      setattr(children, 'restart_requested', True)
      break
    else:  # 'edit': re-ask this child's name and birthdate
      undefine('adult_child_action')
      undefine('children[i].name.first')
      undefine('children[i].birthdate')
      children[i].name.first
      children[i].birthdate
  children[i].age_checked = True

---
id: gather children
code: |
  while True:
    children.target_number
    children.gather()
    if getattr(children, 'restart_requested', False):
      # Clear the flag first, then wipe the list so the count question is asked again
      children.restart_requested = False
      children.clear()
      children.reset_gathered()
      undefine('children.target_number')
      continue
    break
  children_confirmed = True
---

