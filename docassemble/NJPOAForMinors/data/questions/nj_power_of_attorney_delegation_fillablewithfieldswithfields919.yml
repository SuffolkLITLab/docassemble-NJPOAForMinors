id: Caregiver_info_screen
continue button field: Caregiver_info_screen
question: "Caregiver screens"
subquestion: |2-
  **Choosing a caregiver**
  In the next few screens, you will choose the person you want to take care of the ${ child_word }. This person must be at least 18 years old.
  
  **Choosing an alternate caregiver**
  You will also choose a backup caregiver. This is someone who can take over if your first choice cannot or does not want to care for the ${ child_word }.
  
  **Parental powers and timeline**
  Next, you will choose which parental powers you want to give the caregiver. You will also choose when the caregiver will get those powers.
  
  Remember:
  
  * You can only give the caregiver powers that you have. 
  
  * Giving the caregiver these powers does not take them away from you.
  
  * The powers last for one year. The year starts on the date you sign this form or the date an event you choose happens.
  
  * You can renew the powers for another year by completing this process again.
  
  * You can take back the powers at any time by telling the caregiver.
