id: NJ Power of Attorney Delegation Fillable with fields with fields9 19 intro
continue button field: nj_power_of_attorney_delegation_fillablewithfieldswithfields919_intro
question: "NJ Temporary Power of Attorney Appointment of a Minor (Fillable Form)"
subquestion: |2
  Complete this form if you are a parent, custodian, or guardian in NJ wishing to temporarily give your parental powers over a minor child or ward to someone else.
  
  ### Before you get started
  - Collect basic information about the parents and guardians, the children or wards, and the caregivers you wish to appoint.
  
  ### When you are finished
  - Sign the form in the presence of a notary, 2 witnesses and the other person you share custody with (if applicable).
  - Give a copy to the appointed caregiver and keep a copy for yourself.
  
  
  More questions? Ask here: **Add AskLit**

