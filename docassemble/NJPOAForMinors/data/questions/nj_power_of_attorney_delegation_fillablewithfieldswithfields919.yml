metadata:
  title: >-
    NJ Power of Attorney Delegation Fillable-with-fields-with-fields9-19
  short title: >-
    NJ Power of Attorney Dele
  description: |-
    This form allows parents, custodians, or guardians to delegate authority to an alternative caregiver for the care of their minor child or ward. It ensures that the caregiver can make important decisions regarding the child's welfare.
  can_I_use_this_form: |
    You can use this form if you are a parent, custodian, or guardian wishing to temporarily delegate your authority over a minor child. Ensure you have the necessary consent from any other legal guardians involved.
  before_you_start: |
    ### Before you get started
    - Gather the necessary information about yourself, the child, and the alternative caregiver.
    - Ensure that the other parent or legal guardian is available to provide consent if required.

    ### When you are finished
    - Sign the form in the presence of witnesses.
    - Provide a copy to the attorney-in-fact and retain a copy for your records.
  when_you_are_finished: |
    After completing the form, ensure that the attorney-in-fact understands their responsibilities. Keep a copy for your records and provide one to the designated caregiver.
