id: NJ Power of Attorney Delegation Fillable with fields with fields9 19 intro
continue button field: nj_power_of_attorney_delegation_fillablewithfieldswithfields919_intro
question: NJ Temporary Power of Attorney Delegation for Minor Children (Fillable Form)
subquestion: |
  ### Before you get started
  - Gather the necessary information about yourself, the child, and the alternative caregiver.
  - Ensure that the other parent or legal guardian is available to provide consent if required.
  
  ### When you are finished
  - Sign the form in the presence of witnesses.
  - Provide a copy to the attorney-in-fact and retain a copy for your records.
  
  You can use this form if you are a parent, custodian, or guardian wishing to temporarily delegate your authority over a minor child. Ensure you have the necessary consent from any other legal guardians involved.
  
  More questions? Ask here: **Add AskLit**
---
id: Parties Information
question: |
  Parties Information
subquestion: "Provide details about the parent(s), custodian(s), or guardian(s) and the assigned caregiver."
fields:
  - "Names of parent(s), custodian(s), or guardian(s)": users_names
    datatype: area
  - label: "Addresses of parent(s), custodian(s), or guardian(s)"
    field: users_addresses
    datatype: area
    input type: area
  - "Phone numbers of parent(s), custodian(s), or guardian(s)": users_phone_numbers
    datatype: area
  - label: Name of alternative caregiver
    field: caregiver_address
    input type: area
  - Home address of alternative caregiver: caregiver_address
  - Phone number of alternative caregiver: caregiver_phone_number
---
id: children names
question: Children/ Ward Information
subquestion: What is your child(ren)’s/ ward’s name(s) and date(s) of birth?
fields:
  - Child/ Ward Name: children1_name
  - label: Date of Birth
    field: children1_birthdate
    datatype: BirthDate
  - label: Child/ Ward Name
    field: children2_name
    required: False
  - label: Date of Birth
    field: children2_birthdate
    datatype: BirthDate
    required: False
  - label: Child/ Ward Name
    field: children3_name
    required: False
  - label: Date of Birth
    field: children3_birthdate
    datatype: BirthDate
    required: False
  - label: Child/ Ward Name
    field: children4_name
    required: False
  - label: Date of Birth
    field: children4_birthdate
    datatype: BirthDate
    required: False
---
id: Alternate Attorney in Fact
question: Alternate Attorney-in-Fact/Caregiver
subquestion: "In the event that the caregiver is unable or unwilling to act as attorney-in-fact to my child(ren)/ ward(s), I hearby name the following person as an alternate."
fields:
  - label: "Name of Alternate Caregiver "
    field: caregiver2_name
    input type: area
  - "Address of Alternate Caregiver ": caregiver2_address
  - "Phone Number of Alternate Caregiver ": caregiver2_phone_number
---
id: Delegated Powers
question: |
  Delegated Powers
subquestion: Specify the powers being delegated to the Caregiver
fields:
  - "Caregiving power ": power_caregiving_yes
    datatype: yesno
  - Well-being power: power_wellbeing_yes
    datatype: yesno
  - "Education power ": power_education_yes
    datatype: yesno
  - Healthcare power: power_healthcare_yes
    datatype: yesno
  - "Travel power ": power_travel_yes
    datatype: yesno
  - "Financial power ": power_financial_yes
    datatype: yesno
  - "All Other Powers ": power_other_yes
    datatype: yesno
---
id: Triggering Events
question: |
  Triggering Events
subquestion: Select the event(s) that will give authority to the caregiver.
fields:
  - The execution of this document on the latest date below: triggering_event_execution_yes
    datatype: yesno
  - "My attending physician concludes that I am mentally incapacitated, and thus unable to care for my child(ren)/ ward(s)": triggering_event_mental_incapacity_yes
    datatype: yesno
  - "My attending physician concludes that I am physically debilitated, and thus unable to care for my child(ren)/ ward(s)": triggering_event_physical_debilitation_yes
    datatype: yesno
  - "I am detained in immigration detention, removed, or deported": triggering_event_immigration_yes
    datatype: yesno
  - "I am incarcerated based on criminal charges, including pending charges, or conviction": triggering_event_incarceration_yes
    datatype: yesno
  - I am deployed in military service: triggering_event_military_yes
    datatype: yesno
  - Upon my death: triggering_event_death_yes
    datatype: yesno
---
id: question_1790192051493
question: Will the other parent sign?
fields:
  - Other parent sign?: other_parent_will_sign
    datatype: yesnoradio
---
