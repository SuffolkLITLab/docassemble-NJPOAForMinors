id: NJ Power of Attorney Delegation Fillable with fields with fields9 19 intro
continue button field: nj_power_of_attorney_delegation_fillablewithfieldswithfields919_intro
question: "NJ Temporary Caregiver Form"
subquestion: |2
  Fill out this form if you are a {parent}, {custodian}, or {guardian} of a minor child or {ward} in NJ wishing to temporarily give {parental powers} to someone else.
  
  ### Before you get started
  * Collect names, addresses and phone numbers of the
      * Person you share custody with (if applicable),
      * {Caregiver} and
      * Alternate caregiver
  * Collect names and birthdates of your children or wards.
  
  ### Important information to know
  * You do not lose any of your parental powers when you give a caregiver power to care for your child through this form.
  * You can only give the caregiver powers that you have.
  * The caregiver you choose must be at least 18 years old.
  * The caregiver will have the powers for up to one year from the date of an event you will choose in this form.
  * You can renew the powers by repeating this process.
  * You can take back the powers at any time by telling the caregiver.
  
  ### When you are finished
  * Sign the form in the presence of a notary, two witnesses and the person you share custody with (if applicable).
  * Give a copy to the caregiver and keep a copy for yourself.

terms:
  parent: |
    A biological or adoptive parent.
  guardian: |
    Someone a court picked to care for a child and make choices for them.
  custodian: |
    Someone who is not a parent that has been given legal and physical custody by a court.
  ward: |
    A child who is appointed a guardian.
  parental powers: |
    The rights and responsibilities a parent has to care and make decisions about the health, education, and safety of their child.
  caregiver: |
    A person who is 18 years or older that you want to give parental powers to.
