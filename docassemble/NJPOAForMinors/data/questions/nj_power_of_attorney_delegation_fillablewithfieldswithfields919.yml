id: Delegated Powers
question: |2
  % if share_custody and other_parent_will_sign:
    We allow the caregiver to
    % else:
    I allow the caregiver to
    % endif
fields:
  - label: "Watch the ${ child_word } for a short time  "
    field: power_caregiving_yes
    datatype: yesno
    help: "An example may be when you go on a vacation, this person will watch the ${ child_word }."
  - label: "Care for the ${ child_pos } basic needs"
    field: power_wellbeing_yes
    datatype: yesno
    help: Food, shelter, mental and physical safety, etc.
  - label: Make education decisions
    field: power_education_yes
    datatype: yesno
    help: "Enrollment, access to school records, sign permission slips, any and all decisions about school, including special education."
  - label: "Make medical, dental, and mental health decisions"
    field: power_healthcare_yes
    datatype: yesno
    help: "Including signing of documents, waivers and releases, access to medical records, admitting or discharge from any hospital or medical care facility, meetings with any health care provider, consenting, withholding, changing or withdrawal of procedures."
  - label: "Make travel and related decisions "
    field: power_travel_yes
    datatype: yesno
    help: For example, hotel rooms. This applies to both national and international travel.

  - "Make financial and legal decisions ": power_financial_yes
    datatype: yesno
  - "Make other decisions ": power_other_yes
    datatype: yesno
  - label: "All of the above"
    field: power_all_yes
    datatype: yesno
    check others: True

validation code: |
  if not (power_caregiving_yes or power_wellbeing_yes or power_education_yes
          or power_healthcare_yes or power_travel_yes or power_financial_yes
          or power_other_yes or power_all_yes):
    validation_error("Choose at least one power to give the caregiver.",
                     field="power_all_yes")
